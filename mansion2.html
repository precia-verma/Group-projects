<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Mansion Level 2 - WASD Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            touch-action: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* Mobile touch controls */
        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            z-index: 1000;
        }
        
        #dpad {
            position: relative;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }
        
        .dpad-button {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            transition: all 0.1s;
        }
        
        .dpad-button:active,
        .dpad-button.active {
            background: rgba(74, 158, 255, 0.6);
            border-color: rgba(74, 158, 255, 0.9);
            transform: scale(0.95);
        }
        
        #btn-up {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #btn-up:active,
        #btn-up.active {
            transform: translateX(-50%) scale(0.95);
        }
        
        #btn-down {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        
        #btn-down:active,
        #btn-down.active {
            transform: translateX(-50%) scale(0.95);
        }
        
        #btn-left {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        
        #btn-left:active,
        #btn-left.active {
            transform: translateY(-50%) scale(0.95);
        }
        
        #btn-right {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        
        #btn-right:active,
        #btn-right.active {
            transform: translateY(-50%) scale(0.95);
        }
        
        /* Show mobile controls on touch devices */
        @media (pointer: coarse) {
            #mobile-controls {
                display: block;
            }
        }
        
        /* Adjust for smaller screens */
        @media (max-width: 480px) {
            #dpad {
                width: 130px;
                height: 130px;
            }
            
            .dpad-button {
                width: 45px;
                height: 45px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Canvas will be added here by the script -->
    </div>
    
    <!-- Mobile touch controls -->
    <div id="mobile-controls">
        <div id="dpad">
            <div class="dpad-button" id="btn-up" data-key="w">▲</div>
            <div class="dpad-button" id="btn-down" data-key="s">▼</div>
            <div class="dpad-button" id="btn-left" data-key="a">◄</div>
            <div class="dpad-button" id="btn-right" data-key="d">►</div>
        </div>
    </div>
    
    <script src="assets/js/mansionLevel2.js"></script>
</body>
</html>
